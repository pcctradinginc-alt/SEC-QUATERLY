name: SEC 13F Signal Engine

on:
  schedule:
    # Daily at 14:00 UTC on the 14th–20th of Feb/May/Aug/Nov;
    # date_check.py decides whether today is the actual run date.
    - cron: '0 14 14-20 2,5,8,11 *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of date'
        required: false
        default: 'false'
      target_date:
        description: 'Override target date (YYYY-MM-DD)'
        required: false
        default: ''
      skip_email:
        description: 'Build the report but do not e-mail it'
        required: false
        default: 'false'
      target_report_date:
        description: 'Rebuild a specific 13F quarter, e.g. 2026-03-31 (baseline mode)'
        required: false
        default: ''
      baseline_only:
        description: 'Fetch and parse only, then commit - used to rebuild a prior quarter'
        required: false
        default: 'false'

# Runs write generated data back to the branch. Two of them in flight means one
# loses its push, so they queue instead of racing.
concurrency:
  group: sec-13f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests gate the analysis: a red suite must never be able to compute signals,
  # render a report and mail it out in parallel.
  analyze:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every step must agree on "today": each script keys its data files on the
    # current date, so a per-step timezone would break the hand-off near midnight.
    env:
      TZ: Europe/Berlin
      SEC_TARGET_REPORT_DATE: ${{ github.event.inputs.target_report_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if today is a run date
        id: date_check
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python src/date_check.py

      - name: 1 · Fetch SEC 13F filings
        if: steps.date_check.outputs.should_run == 'true'
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python src/fetch_filings.py

      - name: 2 · Parse holdings and quarter-over-quarter deltas
        if: steps.date_check.outputs.should_run == 'true'
        run: python src/parse_13f.py

      - name: 3 · Data-quality gate (fails closed)
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        run: python src/data_quality.py

      - name: 4 · Alpha components, crowding, sell signals
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        run: python src/scoring.py

      - name: 5 · Deterministic SIGNAL SCORE + Form 4 insider look-up → Top 10
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        run: python src/signal_engine.py

      - name: 6 · Tradier Call selection (predefined filters)
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        env:
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
        run: python src/options_lookup.py

      - name: 7 · Commentary (cost-routed Haiku → Sonnet → Opus cascade)
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/explain_signals.py

      - name: 8 · Backtest past Top-10s
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        run: python src/backtest.py

      - name: 9 · Render and e-mail the report
        if: steps.date_check.outputs.should_run == 'true' && github.event.inputs.baseline_only != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: |
          if [ "${{ github.event.inputs.skip_email }}" = "true" ]; then
            python src/send_report.py --no-send
          else
            python src/send_report.py
          fi

      - name: Commit updated data and report
        if: steps.date_check.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # data/insider_cache/ is deliberately git-ignored: it is a raw EDGAR
          # cache, and a stale snapshot can silently carry wrong data forward.
          PATHS="data/holdings/ data/llm_cache/ reports/"
          MSG="📊 Quarterly 13F signal run $(date +%Y-%m-%d)"

          # These files are generated wholesale, so a three-way merge on them is
          # meaningless: two runs for the same date rewrite the same JSON and a
          # rebase stops on content conflicts. Instead, adopt whatever the branch
          # now points at as the base and re-commit this run's output on top.
          commit_output() {
            git add $PATHS
            git diff --staged --quiet && return 1
            git commit -m "$MSG"
          }

          commit_output || { echo "nothing to commit"; exit 0; }

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) – rebasing onto the branch tip"
            git fetch origin "${GITHUB_REF_NAME}" || exit 1
            git reset --mixed "origin/${GITHUB_REF_NAME}" || exit 1
            commit_output || { echo "output already on the branch"; exit 0; }
          done
          echo "could not push after 3 attempts"; exit 1

      - name: Send failure alert
        if: failure() && steps.date_check.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python src/notify.py \
            "GitHub Actions – SEC 13F Signal Engine" \
            "Workflow run ${{ github.run_id }} failed. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
